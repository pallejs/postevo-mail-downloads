name: Prepare download release

on:
  workflow_dispatch:
    inputs:
      artifact_urls:
        description: "JSON array of five temporary URLs for the approved binary build archives"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-download-release
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify approved installers
        run: python3 .github/scripts/prepare_release.py
      - name: Upload verified files to draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v0.41.0 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload v0.41.0 --repo "$GITHUB_REPOSITORY" --clobber release-files/*
